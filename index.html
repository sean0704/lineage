<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地監冒險 3D (Lineage Dungeon 3D)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* General Body and Container Styles */
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
            user-select: none;
        }
        .game-container {
            background-color: #2d3748;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 100%;
            padding: 1.25rem;
            border: 2px solid #4a5568;
            display: flex;
            flex-direction: column;
            gap: 0.65rem; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            font-size: 1.75rem; 
            font-weight: 700;
            color: #a0aec0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* 3D Viewport Area */
        .stage-viewport-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #111622;
            border-radius: 0.75rem;
            border: 1px solid #4a5568;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        #threeCanvasContainer {
            width: 100%;
            height: 100%;
        }
        .stage-overlay-hud {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            right: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(26, 32, 44, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.25rem 0.65rem;
            border-radius: 0.5rem;
            border: 1px solid #4a5568;
            font-size: 0.8rem;
            font-weight: bold;
            color: #e2e8f0;
        }
        .monster-hud-card {
            background: rgba(26, 32, 44, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #4a5568;
            min-width: 150px;
            text-align: right;
        }
        .monster-hp-bar {
            width: 100%;
            height: 8px;
            background-color: #4a5568;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.25rem;
        }
        .monster-hp-fill {
            height: 100%;
            background: linear-gradient(to right, #f56565, #c53030);
            width: 100%;
            transition: width 0.3s ease;
        }

        /* Status, Stats, and Health Bar */
        .status-bar {
            display: flex; flex-direction: column;
            background-color: #4a5568; padding: 0.4rem; border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3); border: 1px solid #5a6478;
        }
        .health-bar-wrapper {
            width: 100%; background-color: #3a4352;
            border-radius: 0.5rem; position: relative;
            height: 2rem; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .health-bar-container {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            background-color: #3a4352; border-radius: 0.5rem; overflow: hidden;
        }
        .health-bar-fill {
            height: 100%; background: linear-gradient(to right, #e53e3e, #c53030);
            width: 100%; transition: width 0.4s ease-in-out; border-radius: 0.5rem;
        }
        .health-bar-text {
            position: absolute; color: white; font-weight: bold; font-size: 0.9rem; text-shadow: 1px 1px 2px black;
        }

        /* Quick Potion Bar */
        .quick-potion-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }
        .quick-potion-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            background: #2d3748;
            border: 1px solid #4a5568;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-potion-btn:hover:not(:disabled) {
            background: #3a4352;
            transform: translateY(-1px);
        }
        .quick-potion-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid; grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem; text-align: center; font-size: 0.85rem;
        }
        .stat-item {
            background-color: #3a4352; padding: 0.4rem 0.2rem; border-radius: 0.5rem;
        }
        .stat-item .value { font-weight: 700; font-size: 1rem; color: #e2e8f0; }
        .stat-item .label { font-size: 0.75rem; color: #a0aec0; }

        /* Game Output & Buttons */
        .game-output {
            background-color: #1a202c; border: 1px solid #4a5568; border-radius: 0.75rem;
            padding: 0.75rem; height: 110px; overflow-y: auto; white-space: pre-wrap;
            word-wrap: break-word; font-size: 0.92rem; line-height: 1.45; color: #e2e8f0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .boss-encounter {
            color: #f56565;
            font-weight: bold;
        }
        .button-group {
            display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center;
        }
        .game-button {
            background-color: #4299e1; color: white; padding: 0.65rem 1.25rem;
            border-radius: 0.75rem; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            border: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            flex-grow: 1; min-width: 105px;
        }
        .game-button:hover {
            background-color: #3182ce; transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.4);
        }
        .game-button:disabled {
            background-color: #a0aec0; cursor: not-allowed; transform: none; box-shadow: none;
        }
        .red-button { background-color: #e53e3e; } .red-button:hover { background-color: #c53030; }
        .green-button { background-color: #48bb78; } .green-button:hover { background-color: #38a169; }
        .gray-button { background-color: #718096; } .gray-button:hover { background-color: #4a5568; }

        /* List & Item Styles (Inventory, Equipped, Shop) */
        .list-container {
            background-color: #1a202c; border: 1px solid #4a5568; border-radius: 0.75rem;
            padding: 0.75rem; max-height: 220px; overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .list-container ul { list-style: none; padding: 0; margin: 0; }
        .list-container li {
            padding: 0.45rem; border-bottom: 1px dashed #4a5568; display: flex;
            justify-content: space-between; align-items: center; transition: background-color 0.2s ease;
        }
        .list-container li:hover { background-color: #3a4352; border-radius: 0.5rem; }
        .list-container li:last-child { border-bottom: none; }
        .list-container li .item-name { flex-grow: 1; }
        .list-container li .item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        .list-container li button, .shop-action-btn {
            color: white; padding: 0.25rem 0.65rem; border-radius: 0.5rem;
            font-size: 0.85rem; cursor: pointer; transition: background-color 0.2s ease; border: none;
        }
        .equip-btn { background-color: #4299e1; } .equip-btn:hover { background-color: #3182ce; }
        .use-btn { background-color: #48bb78; } .use-btn:hover { background-color: #38a169; }

        /* Modal Styles */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.82); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background-color: #2d3748; padding: 1.5rem; border-radius: 1.0rem;
            text-align: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            border: 2px solid #4a5568; max-width: 90%; width: 500px;
        }
        .modal-content h2 { font-size: 1.75rem; color: #a0aec0; margin-bottom: 0.75rem; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: left; margin-bottom: 1.25rem; }
        .comparison-grid h3 { font-weight: bold; color: #718096; border-bottom: 1px solid #4a5568; padding-bottom: 0.4rem; }
        .stat-change-loss { color: #f56565; }
        .stat-change-gain { color: #48bb78; }
        
        /* Shop */
        .shop-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; border-bottom: 2px solid #4a5568; }
        .shop-tab {
            padding: 0.6rem 1.25rem; border-radius: 0.5rem 0.5rem 0 0; background-color: #4a5568;
            cursor: pointer; transition: background-color 0.2s; font-weight: bold;
        }
        .shop-tab.active { background-color: #3a4352; color: #e2e8f0; }
        .shop-item-list { max-height: 260px; overflow-y: auto; text-align: left; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.4rem; border-bottom: 1px dashed #4a5568; }
        .shop-item:last-child { border-bottom: none; }
        .shop-item-info { flex-grow: 1; }
        .shop-item-name { font-weight: bold; }
        .shop-item-price { color: #f6e05e; }
        .buy-btn { background-color: #48bb78; } .buy-btn:hover:not(:disabled) { background-color: #38a169; }
        .sell-btn { background-color: #f6e05e; color: #1a202c; } .sell-btn:hover { background-color: #ecc94b; }
        .shop-action-btn:disabled { background-color: #718096; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="gameContainer" class="game-container">
        <!-- Header -->
        <div class="header">
            <h2>地監冒險 <span class="text-xs text-blue-400 font-normal ml-1">3D Edition</span></h2>
            <button id="muteBtn" class="text-sm px-3 py-1 rounded-md bg-gray-700 hover:bg-gray-600 transition-colors">🔊 音效</button>
        </div>

        <!-- 3D Three.js Viewport -->
        <div class="stage-viewport-wrapper">
            <div id="threeCanvasContainer"></div>
            <!-- Dynamic HUD on 3D Viewport -->
            <div class="stage-overlay-hud">
                <div id="locationBadge" class="hud-badge">安全區域：村莊</div>
                <div id="monsterHudCard" class="monster-hud-card hidden">
                    <div id="monsterHudName" class="font-bold text-sm">怪物名稱</div>
                    <div class="monster-hp-bar">
                        <div id="monsterHudHpFill" class="monster-hp-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status & Health Bar -->
        <div class="status-bar">
            <div class="health-bar-wrapper">
                <div id="playerHealthBarContainer" class="health-bar-container">
                    <div id="playerHealthBarFill" class="health-bar-fill"></div>
                </div>
                <div id="playerHealthText" class="health-bar-text"></div>
            </div>
            <!-- Quick Potion Bar -->
            <div class="quick-potion-bar">
                <button id="quickRedPotion" class="quick-potion-btn text-red-300">🔴 紅水 (<span id="redPotionCount">0</span>)</button>
                <button id="quickGreenPotion" class="quick-potion-btn text-green-300">🟢 綠水 (<span id="greenPotionCount">0</span>)</button>
                <button id="quickBravePotion" class="quick-potion-btn text-purple-300">🟣 勇水 (<span id="bravePotionCount">0</span>)</button>
            </div>
        </div>

        <!-- Game Output & Buttons -->
        <div id="gameOutput" class="game-output"></div>
        <div id="buttonGroup" class="button-group"></div>
        <div id="inventoryDisplay" class="list-container hidden"></div>
        
        <!-- Player Stats Grid -->
        <div class="stats-grid">
            <div class="stat-item"><div id="playerGold" class="value">0</div><div class="label">金幣</div></div>
            <div class="stat-item"><div id="playerAttack" class="value">0</div><div class="label">攻擊力</div></div>
            <div class="stat-item"><div id="playerDefense" class="value">0</div><div class="label">防禦力</div></div>
            <div class="stat-item"><div id="playerLevel" class="value">1</div><div class="label">等級</div></div>
            <div class="stat-item"><div id="playerXP" class="value">0/0</div><div class="label">經驗值</div></div>
            <div class="stat-item"><div id="currentFloor" class="value">1</div><div class="label">樓層</div></div>
        </div>

        <!-- Equipped Items Display -->
        <div id="equippedItemsDisplay" class="list-container">
            <h3 class="text-base font-bold mb-1 text-center text-gray-300 flex justify-between items-center px-1">
                <span>已裝備物品</span>
                <button id="toggleEquippedButton" class="text-xs px-2 py-0.5 rounded bg-blue-600 hover:bg-blue-700 transition-colors">展開</button>
            </h3>
            <div id="equippedListContainer" class="hidden"><ul id="equippedList"></ul></div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
            <h2>遊戲結束！</h2>
            <p id="gameOverMessage" class="text-lg mb-6"></p>
            <button id="restartButton" class="game-button green-button">重新開始</button>
        </div>
    </div>
    <div id="equipConfirmModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="equipModalTitle">確認裝備</h2>
            <div id="equipComparison" class="comparison-grid"></div>
            <div class="flex justify-center gap-4">
                <button id="confirmEquipButton" class="game-button green-button">確認</button>
                <button id="cancelEquipButton" class="game-button gray-button">取消</button>
            </div>
        </div>
    </div>
    <div id="shopModal" class="modal hidden">
        <div class="modal-content">
            <h2>奇岩村莊商店</h2>
            <div class="shop-tabs">
                <div id="buyTab" class="shop-tab active" onclick="Game.renderShop('buy')">購買</div>
                <div id="sellTab" class="shop-tab" onclick="Game.renderShop('sell')">販賣</div>
            </div>
            <div id="shopItemList" class="shop-item-list"></div>
            <button id="closeShopButton" class="game-button gray-button mt-4">離開商店</button>
        </div>
    </div>

    <!-- Game Data & Three.js Visual Stage & Audio Scripts -->
    <script src="js/game_data.js"></script>
    <script src="js/audio_manager.js"></script>
    <script src="js/dungeon_renderer.js"></script>
    <script src="js/entity_manager.js"></script>

    <!-- Game Core Logic -->
    <script>
    if (!window.AudioManager) {
        window.AudioManager = window.GameAudio || {
            init() {}, setMuted() {}, playTone() {}, playAttack() {}, playHit() {},
            playPotion() {}, playChestOpen() {}, playLevelUp() {}, playBossAlert() {}, playFootstep() {}
        };
    }

    const Game = {
        DOM: {},
        renderer3D: null,
        entityManager: null,
        CONSTANTS: {
            MAX_DUNGEON_FLOOR: 7,
            EXPLORATIONS_PER_FLOOR: 10,
            MONSTER_HP_SCALING: 0.2,
            MONSTER_ATTACK_SCALING: 0.1,
            SHOP_BUY_PRICE_MULTIPLIER: 2,
        },
        state: {
            player: null,
            currentMonster: null,
            monsterMaxHp: 0,
            gamePhase: 'start',
            lastMajorPhase: 'start',
            currentShopTab: 'buy',
            isMuted: false
        },
        data: {
            monsters: {},
            items: {},
            floorMonsterPools: {},
            shopInventory: [],
        },

        async init() {
            try {
                this.cacheDOMElements();
                this.init3DStage();
                await this.loadData();
                this.bindEvents();
                this.checkForSave();
            } catch (error) {
                console.error("遊戲初始化失敗:", error);
                this.setOutput(`遊戲資料載入警訊: ${error.message}，已啟用內建模式。`);
            }
        },

        init3DStage() {
            const container = document.getElementById('threeCanvasContainer');
            this.renderer3D = new DungeonRenderer();
            this.renderer3D.init(container);
            this.entityManager = new EntityManager(this.renderer3D);
            this.renderer3D.entityManager = this.entityManager;
        },

        cacheDOMElements() {
            const ids = [
                'playerHealthBarFill', 'playerHealthText', 'equippedList', 'playerGold', 'playerAttack',
                'playerDefense', 'playerLevel', 'playerXP', 'currentFloor',
                'gameOutput', 'buttonGroup', 'inventoryDisplay', 'gameOverModal',
                'gameOverMessage', 'restartButton', 'toggleEquippedButton', 'equippedListContainer',
                'equipConfirmModal', 'equipModalTitle', 'equipComparison', 'confirmEquipButton', 'cancelEquipButton',
                'shopModal', 'buyTab', 'sellTab', 'shopItemList', 'closeShopButton',
                'muteBtn', 'locationBadge', 'monsterHudCard', 'monsterHudName', 'monsterHudHpFill',
                'quickRedPotion', 'quickGreenPotion', 'quickBravePotion',
                'redPotionCount', 'greenPotionCount', 'bravePotionCount'
            ];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) this.DOM[id] = el;
            });
        },
        
        async loadData() {
            try {
                const [monsterResponse, itemResponse, floorResponse, shopResponse] = await Promise.all([
                    fetch('monsters.json'),
                    fetch('items.json'),
                    fetch('dungeon_floors.json'),
                    fetch('shop.json')
                ]);

                if (monsterResponse.ok) this.data.monsters = await monsterResponse.json();
                if (itemResponse.ok) this.data.items = await itemResponse.json();
                if (floorResponse.ok) this.data.floorMonsterPools = await floorResponse.json();
                if (shopResponse.ok) this.data.shopInventory = await shopResponse.json();
            } catch (error) {
                console.warn("無法透過網路 fetch JSON (可能是本地 file:// 協定限制)，切換至內建資料庫。", error);
            }

            // Ensure fallback if any data is missing
            if (window.DEFAULT_GAME_DATA) {
                if (!this.data.monsters || Object.keys(this.data.monsters).length === 0) {
                    this.data.monsters = window.DEFAULT_GAME_DATA.monsters;
                }
                if (!this.data.items || Object.keys(this.data.items).length === 0) {
                    this.data.items = window.DEFAULT_GAME_DATA.items;
                }
                if (!this.data.floorMonsterPools || Object.keys(this.data.floorMonsterPools).length === 0) {
                    this.data.floorMonsterPools = window.DEFAULT_GAME_DATA.floorMonsterPools;
                }
                if (!this.data.shopInventory || this.data.shopInventory.length === 0) {
                    this.data.shopInventory = window.DEFAULT_GAME_DATA.shopInventory;
                }
            }
        },

        bindEvents() {
            this.DOM.restartButton.addEventListener('click', () => this.resetGame(true));
            this.DOM.toggleEquippedButton.addEventListener('click', () => this.toggleEquippedDisplay());
            this.DOM.cancelEquipButton.addEventListener('click', () => this.DOM.equipConfirmModal.classList.add('hidden'));
            this.DOM.closeShopButton.addEventListener('click', () => this.closeShop());
            
            // Audio toggle
            this.DOM.muteBtn.addEventListener('click', () => {
                this.state.isMuted = !this.state.isMuted;
                window.AudioManager?.setMuted?.(this.state.isMuted);
                this.DOM.muteBtn.textContent = this.state.isMuted ? '🔇 靜音' : '🔊 音效';
            });

            // Quick Potion Buttons
            this.DOM.quickRedPotion.addEventListener('click', () => this.useQuickPotion('redPotion'));
            this.DOM.quickGreenPotion.addEventListener('click', () => this.useQuickPotion('greenPotion'));
            this.DOM.quickBravePotion.addEventListener('click', () => this.useQuickPotion('bravePotion'));
        },

        checkForSave() {
            if (localStorage.getItem('lineageGameSave')) {
                this.setOutput('發現之前的冒險存檔。');
                this.showStartOptions(true);
            } else {
                this.resetGame();
            }
        },

        resetGame(isManualRestart = false) {
            if (isManualRestart) {
                this.deleteSave();
            }
            this.state.player = this.getInitialPlayerState();
            this.state.currentMonster = null;
            this.DOM.gameOverModal.classList.add('hidden');
            this.setOutput('歡迎來到《天堂 3D》地監冒險！\n你已在木人場訓練有成，隨時準備踏入深邃未知的地監！');
            this.setPhase('start');
        },

        getInitialPlayerState() {
            const level = 5;
            const maxHp = 100 + (level - 1) * 10;
            return {
                hp: maxHp, maxHp: maxHp, gold: 500,
                baseAttack: 10 + (level - 1) * 2,
                baseDefense: 0 + (level - 1) * 1,
                level: level, xp: 0,
                xpToNextLevel: this.getXpRequiredForLevel(level),
                inventory: ['redPotion', 'redPotion', 'redPotion'],
                equipped: { head: null, body: null, legs: null, rightHand: null, leftHand: null },
                currentFloor: 1, explorationsOnFloor: 0,
            };
        },

        updateUI() { this.updateStatus(); },
        updateStatus() {
            const p = this.state.player;
            if (!p) return;
            const stats = this.calculatePlayerStats();
            const hpPercentage = Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100));
            this.DOM.playerHealthBarFill.style.width = `${hpPercentage}%`;
            this.DOM.playerHealthText.textContent = `${p.hp} / ${p.maxHp}`;
            this.DOM.playerGold.textContent = p.gold;
            this.DOM.playerAttack.textContent = stats.attack;
            this.DOM.playerDefense.textContent = stats.defense;
            this.DOM.playerLevel.textContent = p.level;
            this.DOM.playerXP.textContent = `${p.xp} / ${p.xpToNextLevel}`;
            this.DOM.currentFloor.textContent = p.currentFloor;

            // Quick Potion Counts
            const redCount = p.inventory.filter(k => k === 'redPotion').length;
            const greenCount = p.inventory.filter(k => k === 'greenPotion').length;
            const braveCount = p.inventory.filter(k => k === 'bravePotion').length;

            this.DOM.redPotionCount.textContent = redCount;
            this.DOM.greenPotionCount.textContent = greenCount;
            this.DOM.bravePotionCount.textContent = braveCount;

            this.DOM.quickRedPotion.disabled = redCount === 0 || p.hp >= p.maxHp;
            this.DOM.quickGreenPotion.disabled = greenCount === 0 || p.hp >= p.maxHp;
            this.DOM.quickBravePotion.disabled = braveCount === 0 || p.hp >= p.maxHp;

            this.renderEquippedItems();
            this.updateMonsterHUD();
        },

        updateMonsterHUD() {
            const m = this.state.currentMonster;
            if (m && this.state.gamePhase === 'combat') {
                this.DOM.monsterHudCard.classList.remove('hidden');
                this.DOM.monsterHudName.innerHTML = `${m.name} <span class="text-xs text-gray-400">Lv.${m.level}</span>`;
                const pct = Math.max(0, Math.min(100, (m.hp / this.state.monsterMaxHp) * 100));
                this.DOM.monsterHudHpFill.style.width = `${pct}%`;
            } else {
                this.DOM.monsterHudCard.classList.add('hidden');
            }
        },
        
        renderButtons(buttonArray) {
            this.DOM.buttonGroup.innerHTML = '';
            buttonArray.forEach(btn => {
                const button = document.createElement('button');
                button.textContent = btn.text;
                button.className = btn.className || 'game-button';
                button.onclick = btn.action;
                button.disabled = btn.disabled || false;
                this.DOM.buttonGroup.appendChild(button);
            });
        },

        renderEquippedItems() {
            this.DOM.equippedList.innerHTML = '';
            const slotOrder = { head: '頭部', body: '身體', legs: '腿部', rightHand: '右手', leftHand: '左手' };
            for(const slotKey in slotOrder) {
                const li = document.createElement('li');
                const itemKey = this.state.player.equipped[slotKey];
                let text = `${slotOrder[slotKey]}: `;
                if (itemKey) {
                    text += this.getFormattedItemName(itemKey);
                    const unequipBtn = document.createElement('button');
                    unequipBtn.textContent = '卸下';
                    unequipBtn.className = 'equip-btn';
                    unequipBtn.onclick = () => this.unequipItem(slotKey);
                    li.innerHTML = `<span class="item-name">${text}</span>`;
                    li.appendChild(unequipBtn);
                } else {
                    text += '無';
                    li.innerHTML = `<span class="item-name text-gray-500">${text}</span>`;
                }
                this.DOM.equippedList.appendChild(li);
            }
        },

        toggleEquippedDisplay() {
            const isHidden = this.DOM.equippedListContainer.classList.toggle('hidden');
            this.DOM.toggleEquippedButton.textContent = isHidden ? '展開' : '收合';
        },

        setPhase(newPhase) {
            this.state.gamePhase = newPhase;
            this.DOM.inventoryDisplay.classList.add('hidden');

            if (newPhase === 'village' || newPhase === 'start') {
                this.renderer3D.setEnvironment('village');
                this.DOM.locationBadge.textContent = '安全區域：奇岩村莊';
                this.entityManager.removeMonster();
                this.entityManager.removeChest();
            } else {
                this.renderer3D.setEnvironment('dungeon', this.state.player.currentFloor);
                this.DOM.locationBadge.textContent = `古魯丁地監 地下 ${this.state.player.currentFloor} 層`;
            }

            switch (newPhase) {
                case 'start': this.showStartOptions(); break;
                case 'village': this.showVillageOptions(); break;
                case 'explore': this.showExploreOptions(); break;
                case 'combat': this.showCombatOptions(); break;
                case 'shop': this.showShop(); break;
            }
            this.updateUI();
        },
        
        showStartOptions(hasSave = false) {
            let buttons = [];
            if (hasSave) {
                buttons.push({ text: '繼續冒險', action: () => this.loadGame(), className: 'game-button green-button' });
                buttons.push({ text: '新遊戲', action: () => this.resetGame(true), className: 'game-button gray-button' });
            } else {
                buttons.push({ text: '進入地監', action: () => this.enterDungeon() });
            }
            this.renderButtons(buttons);
        },

        enterDungeon() {
            window.AudioManager?.playFootstep?.();
            this.setOutput(`你踏入了古魯丁地監地下 ${this.state.player.currentFloor} 層... 周圍漆黑冷冽，火把照亮斑駁石柱。`);
            this.setPhase('explore');
        },

        showVillageOptions() {
            this.setOutput('你回到了溫暖的村莊，微風與營火帶來安心的庇護。');
            this.renderButtons([
                { text: '繼續冒險', action: () => this.enterDungeon() },
                { text: '村莊商店', action: () => { this.state.lastMajorPhase = 'village'; this.setPhase('shop'); } },
                { text: '開啟背包', action: () => this.showInventory() },
                { text: '村莊休息', action: () => this.restInVillage() },
            ]);
        },

        showExploreOptions() {
            this.entityManager.removeMonster();
            this.renderButtons([
                { text: '深入探索', action: () => this.exploreDungeon() },
                { text: '開啟背包', action: () => this.showInventory() },
                { text: '返回村莊', action: () => this.returnToVillage() },
            ]);
        },

        exploreDungeon() {
            window.AudioManager?.playFootstep?.();
            this.state.player.explorationsOnFloor++;
            if (this.state.player.explorationsOnFloor >= this.CONSTANTS.EXPLORATIONS_PER_FLOOR && this.state.player.currentFloor < this.CONSTANTS.MAX_DUNGEON_FLOOR) {
                this.state.player.currentFloor++;
                this.state.player.explorationsOnFloor = 0;
                this.appendOutput(`【樓層躍進】你已抵達地下 ${this.state.player.currentFloor} 層！空氣中的壓迫感更加強烈。`, true);
                this.renderer3D.setEnvironment('dungeon', this.state.player.currentFloor);
            }

            const rand = Math.random();
            if (rand < 0.6) {
                const pool = this.data.floorMonsterPools[this.state.player.currentFloor] || ["goblin", "skeleton"];
                const monsterKey = pool[Math.floor(Math.random() * pool.length)];
                const baseMonster = this.data.monsters[monsterKey] || { name: '妖魔', level: 20, hp: 80, attack: 16, goldMin: 200, goldMax: 400, xpReward: 100, drops: [] };
                
                this.state.currentMonster = { ...baseMonster, key: monsterKey };
                this.state.currentMonster.hp = Math.round(baseMonster.hp * (1 + (this.state.player.currentFloor - 1) * this.CONSTANTS.MONSTER_HP_SCALING));
                this.state.currentMonster.attack = Math.round(baseMonster.attack * (1 + (this.state.player.currentFloor - 1) * this.CONSTANTS.MONSTER_ATTACK_SCALING));
                this.state.monsterMaxHp = this.state.currentMonster.hp;

                const m = this.state.currentMonster;
                const formattedName = this.getFormattedMonsterName(m);
                const isBoss = m.monsterType === 'boss';

                this.entityManager.spawnMonster(monsterKey, isBoss);

                if (isBoss) {
                    window.AudioManager?.playBossAlert?.();
                    this.renderer3D.shakeCamera(0.6, 1.2);
                    this.setOutput(`<div class="boss-encounter">⚠️ 遭遇強大邪氣！${formattedName} (Lv.${m.level}) 降臨在你的面前！</div>`, true);
                } else {
                    this.setOutput(`你遭遇了 ${formattedName} (Lv.${m.level})！拔劍迎戰！`, true);
                }
                this.setPhase('combat');
            } else if (rand < 0.75) {
                this.findChest();
                this.setPhase('explore');
            } else {
                this.appendOutput('你沿著石廊探索，周圍只有滴水聲迴盪...');
                this.setPhase('explore');
            }
            this.updateUI();
        },

        findChest() {
            const floor = this.state.player.currentFloor;
            const rand = Math.random();
            let chestType = 'wooden';

            if (floor <= 2) {
                chestType = rand < 0.8 ? 'wooden' : 'sturdy';
            } else if (floor <= 4) {
                if (rand < 0.4) chestType = 'wooden';
                else if (rand < 0.8) chestType = 'sturdy';
                else chestType = 'ornate';
            } else {
                if (rand < 0.4) chestType = 'sturdy';
                else if (rand < 0.8) chestType = 'ornate';
                else chestType = 'legendary';
            }
            
            const chestDisplayNames = {
                wooden: '木製寶箱', sturdy: '堅固寶箱', ornate: '華麗寶箱', legendary: '傳說寶箱'
            };
            const chestName = chestDisplayNames[chestType];
            const formattedChestName = this.getFormattedChestName(chestType, chestName);

            this.entityManager.spawnChest(chestType);
            this.appendOutput(`你在石室角落發現了一個 ${formattedChestName}！`, true);
            this.openChest(chestType);
        },

        openChest(chestType) {
            setTimeout(() => {
                window.AudioManager?.playChestOpen?.();
                const rand = Math.random();
                let itemRarity = 'common';
                switch (chestType) {
                    case 'wooden': itemRarity = rand < 0.8 ? 'common' : 'uncommon'; break;
                    case 'sturdy': itemRarity = rand < 0.4 ? 'common' : (rand < 0.8 ? 'uncommon' : 'rare'); break;
                    case 'ornate': itemRarity = rand < 0.4 ? 'uncommon' : (rand < 0.8 ? 'rare' : 'legendary'); break;
                    case 'legendary': itemRarity = rand < 0.4 ? 'legendary' : 'rare'; break;
                }

                const foundItemKey = this.getRandomItemByRarity(itemRarity);
                if (foundItemKey) {
                    this.state.player.inventory.push(foundItemKey);
                    this.appendOutput(`✨ 寶箱開啟！獲得了 ${this.getFormattedItemName(foundItemKey)}！`, true);
                } else {
                    this.appendOutput('寶箱中空無一物...');
                }
                this.updateUI();
            }, 600);
        },

        getRandomItemByRarity(rarity) {
            const rarityOrder = ['legendary', 'rare', 'uncommon', 'common'];
            let searchIndex = rarityOrder.indexOf(rarity);
            let itemsOfRarity = [];

            while (searchIndex < rarityOrder.length && itemsOfRarity.length === 0) {
                const currentRarity = rarityOrder[searchIndex];
                itemsOfRarity = Object.keys(this.data.items).filter(key => {
                    const item = this.data.items[key];
                    return item.sell && (item.rarity || 'common') === currentRarity;
                });
                searchIndex++;
            }
            if (itemsOfRarity.length > 0) {
                return itemsOfRarity[Math.floor(Math.random() * itemsOfRarity.length)];
            }
            return 'redPotion';
        },

        showCombatOptions() {
            this.renderButtons([
                { text: '⚔️ 揮劍攻擊', action: () => this.playerAttack(), className: 'game-button red-button' },
                { text: '🎒 背包', action: () => this.showInventory() },
                { text: '🏃 逃跑', action: () => this.runAway() },
            ]);
        },

        playerAttack() {
            if (!this.state.currentMonster) return;
            const p = this.state.player;
            const m = this.state.currentMonster;
            const playerStats = this.calculatePlayerStats();

            // Disable buttons during attack animation
            this.renderButtons([
                { text: '戰鬥中...', disabled: true, className: 'game-button gray-button' }
            ]);

            window.AudioManager?.playAttack?.();

            // Trigger 3D leap attack animation
            this.entityManager.animateHeroAttack(() => {
                // On weapon impact
                window.AudioManager?.playHit?.();
                const isCrit = Math.random() < 0.15;
                let damage = Math.max(1, playerStats.attack - Math.floor(m.level / 5));
                if (isCrit) damage = Math.round(damage * 1.5);

                m.hp -= damage;
                this.entityManager.flashRed(this.entityManager.monsterMesh);
                this.entityManager.spawnDamageNumber(isCrit ? `暴擊! -${damage}` : `-${damage}`, 1.2, 1.3, isCrit, isCrit ? '#f6e05e' : '#ffffff');
                this.renderer3D.shakeCamera(isCrit ? 0.45 : 0.25, 0.8);

                this.appendOutput(`你奮力斬向 ${this.getFormattedMonsterName(m)}，造成 ${damage} 點傷害！ (剩餘 HP: ${Math.max(0, m.hp)})`, true);
                this.updateUI();

                if (m.hp <= 0) {
                    setTimeout(() => this.handleMonsterDefeat(), 400);
                    return;
                }

                // Monster counter-attacks after brief delay
                setTimeout(() => {
                    this.entityManager.animateMonsterAttack(() => {
                        window.AudioManager?.playHit?.();
                        const monsterDamage = Math.max(1, m.attack - playerStats.defense);
                        p.hp -= monsterDamage;
                        this.entityManager.flashRed(this.entityManager.heroMesh);
                        this.entityManager.spawnDamageNumber(`-${monsterDamage}`, -1.2, 1.3, false, '#f56565');
                        this.renderer3D.shakeCamera(0.35, 0.7);

                        this.appendOutput(`${this.getFormattedMonsterName(m)} 兇猛反擊，對你造成 ${monsterDamage} 點傷害！`, true);
                        this.updateUI();

                        if (p.hp <= 0) {
                            this.gameOver('你的生命值歸零了。你倒在了陰森的地監深處...');
                        } else {
                            this.showCombatOptions();
                        }
                    });
                }, 500);
            });
        },

        handleMonsterDefeat() {
            const m = this.state.currentMonster;
            const formattedName = this.getFormattedMonsterName(m);
            this.appendOutput(`💀 ${formattedName} 倒下了！你取得了勝利！`, true);

            if (m.monsterType === 'boss') {
                const xpEarned = m.xpReward * 3;
                const goldEarned = (Math.floor(Math.random() * (m.goldMax - m.goldMin + 1)) + m.goldMin) * 3;
                this.state.player.xp += xpEarned;
                this.state.player.gold += goldEarned;
                this.appendOutput(`💥 頭目潰滅！獲得 ${xpEarned} 經驗值 與 <span class="text-yellow-400">${goldEarned} 金幣</span>！`, true);

                const chestType = Math.random() < 0.7 ? 'ornate' : 'legendary';
                this.findChest(chestType);
            } else {
                this.state.player.xp += m.xpReward;
                const goldEarned = Math.floor(Math.random() * (m.goldMax - m.goldMin + 1)) + m.goldMin;
                this.state.player.gold += goldEarned;
                this.appendOutput(`獲得 ${m.xpReward} 經驗值 與 <span class="text-yellow-400">${goldEarned} 金幣</span>。`, true);

                m.drops?.forEach(drop => {
                    if (Math.random() < drop.chance) {
                        this.state.player.inventory.push(drop.itemKey);
                        this.appendOutput(`🎁 怪物掉落了 ${this.getFormattedItemName(drop.itemKey)}！`, true);
                    }
                });
            }

            this.checkLevelUp();
            this.state.currentMonster = null;
            this.entityManager.removeMonster();
            this.setPhase('explore');
        },

        runAway() {
            const m = this.state.currentMonster;
            const escapeChance = m.monsterType === 'boss' ? 0.35 : 0.6;
            if (Math.random() < escapeChance) {
                this.setOutput('你眼疾手快，成功擺脫敵人並逃回安全通道！');
                this.state.currentMonster = null;
                this.entityManager.removeMonster();
                this.setPhase('explore');
            } else {
                this.appendOutput('逃跑失敗！被敵人截住了去路！');
                const playerStats = this.calculatePlayerStats();
                const monsterDamage = Math.max(1, m.attack - playerStats.defense);
                this.state.player.hp -= monsterDamage;
                this.entityManager.spawnDamageNumber(`-${monsterDamage}`, -1.2, 1.3, false, '#f56565');
                this.renderer3D.shakeCamera(0.3, 0.6);
                this.updateStatus();
                if (this.state.player.hp <= 0) {
                    this.gameOver('逃跑不及，你遭受致命重創倒在地監中...');
                }
            }
        },

        useQuickPotion(itemKey) {
            const p = this.state.player;
            const idx = p.inventory.indexOf(itemKey);
            if (idx === -1) return;

            const itemData = this.data.items[itemKey];
            if (!itemData || !itemData.effect) return;

            if (p.hp < p.maxHp) {
                window.AudioManager?.playPotion?.();
                p.inventory.splice(idx, 1);
                p.hp = Math.min(p.maxHp, p.hp + itemData.effect.amount);
                this.entityManager.spawnDamageNumber(`+${itemData.effect.amount}`, -1.2, 1.4, false, '#48bb78');
                this.appendOutput(`飲用 ${itemData.name}，恢復了 ${itemData.effect.amount} 點生命。`);
                this.updateUI();
                if (this.state.gamePhase === 'inventory') this.renderInventory();
            }
        },

        checkLevelUp() {
            while (this.state.player.xp >= this.state.player.xpToNextLevel) {
                this.state.player.level++;
                this.state.player.xp -= this.state.player.xpToNextLevel;
                this.state.player.xpToNextLevel = this.getXpRequiredForLevel(this.state.player.level);
                const hpGain = 10, attackGain = 2, defenseGain = 1;
                this.state.player.maxHp += hpGain;
                this.state.player.baseAttack += attackGain;
                this.state.player.baseDefense += defenseGain;
                this.state.player.hp = this.state.player.maxHp;

                window.AudioManager?.playLevelUp?.();
                this.entityManager.playLevelUpVFX();
                this.appendOutput(`🎉 升級！你升到了等級 ${this.state.player.level}！\n生命上限 +${hpGain}, 基礎攻擊 +${attackGain}, 基礎防禦 +${defenseGain}，生命值全滿！`);
            }
        },

        returnToVillage() {
            this.state.player.currentFloor = 1;
            this.state.player.explorationsOnFloor = 0;
            this.saveGame();
            this.setPhase('village');
        },

        restInVillage() {
            if (this.state.player.hp < this.state.player.maxHp) {
                window.AudioManager?.playPotion?.();
                this.state.player.hp = this.state.player.maxHp;
                this.appendOutput(`你在村莊旅店好好休息了一晚，生命值完全恢復了！`);
                this.updateStatus();
            } else {
                this.appendOutput('你的精力非常充沛，生命值已經全滿。');
            }
        },

        gameOver(message) {
            this.deleteSave();
            this.state.gamePhase = 'game_over';
            this.DOM.gameOverMessage.textContent = message;
            this.DOM.gameOverModal.classList.remove('hidden');
            this.renderButtons([]);
            this.updateUI();
        },

        saveGame() {
            try {
                localStorage.setItem('lineageGameSave', JSON.stringify(this.state.player));
                this.appendOutput('<span class="text-green-400">進度已自動儲存至本機。</span>', true);
            } catch (e) {
                console.error("存檔失敗:", e);
            }
        },

        loadGame() {
            try {
                const savedState = localStorage.getItem('lineageGameSave');
                if (savedState) {
                    this.state.player = JSON.parse(savedState);
                    this.state.currentMonster = null;
                    this.DOM.gameOverModal.classList.add('hidden');
                    this.setOutput('成功讀取進度！你身處溫馨的奇岩村莊。');
                    this.setPhase('village');
                    return true;
                }
            } catch (e) {
                console.error("讀檔失敗:", e);
                this.deleteSave();
            }
            return false;
        },

        deleteSave() {
            localStorage.removeItem('lineageGameSave');
        },

        sortItems(itemKeys) {
            const SORT_ORDER = {
                TYPE: { 'potion': 1, 'scroll': 1, 'weapon': 2, 'armor': 2 },
                SLOT: { 'rightHand': 1, 'leftHand': 2, 'head': 3, 'body': 4, 'legs': 5 },
                RARITY: { 'legendary': 4, 'rare': 3, 'uncommon': 2, 'common': 1 }
            };

            return itemKeys.sort((keyA, keyB) => {
                const itemA = this.data.items[keyA] || {};
                const itemB = this.data.items[keyB] || {};
                const typeA = SORT_ORDER.TYPE[itemA.type] || 99;
                const typeB = SORT_ORDER.TYPE[itemB.type] || 99;
                if (typeA !== typeB) return typeA - typeB;

                if (itemA.type === 'weapon' || itemA.type === 'armor') {
                    const slotA = SORT_ORDER.SLOT[itemA.slot] || 99;
                    const slotB = SORT_ORDER.SLOT[itemB.slot] || 99;
                    if (slotA !== slotB) return slotA - slotB;
                }
                const rarityA = SORT_ORDER.RARITY[itemA.rarity || 'common'] || 0;
                const rarityB = SORT_ORDER.RARITY[itemB.rarity || 'common'] || 0;
                if (rarityA !== rarityB) return rarityB - rarityA;
                return (itemA.name || '').localeCompare(itemB.name || '');
            });
        },

        showInventory() {
            this.state.lastMajorPhase = this.state.gamePhase;
            this.state.gamePhase = 'inventory';
            this.DOM.inventoryDisplay.classList.remove('hidden');
            this.DOM.inventoryDisplay.innerHTML = `<h3 class="text-base font-bold mb-2 text-center text-gray-300">冒險者背包</h3><ul id="inventoryListUl"></ul>`;
            this.renderInventory();
            this.renderButtons([{ text: '返回', action: () => this.closeSubmenu() }]);
            this.updateUI();
        },

        renderInventory() {
            const listUl = this.DOM.inventoryDisplay.querySelector('#inventoryListUl');
            listUl.innerHTML = '';
            if (this.state.player.inventory.length === 0) {
                listUl.innerHTML = '<li class="text-center text-gray-400 p-2">背包目前空無一物。</li>';
                return;
            }
            const itemCounts = this.state.player.inventory.reduce((acc, key) => {
                acc[key] = (acc[key] || 0) + 1;
                return acc;
            }, {});

            const sortedItemKeys = this.sortItems(Object.keys(itemCounts));

            for (const itemKey of sortedItemKeys) {
                const itemData = this.data.items[itemKey] || { name: itemKey, type: 'item' };
                const li = document.createElement('li');
                let text = `${this.getFormattedItemName(itemKey)} x${itemCounts[itemKey]}`;
                li.innerHTML = `<span class="item-name">${text}</span>`;
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'item-actions';
                if (itemData.type === 'weapon' || itemData.type === 'armor') {
                    const equipBtn = document.createElement('button');
                    equipBtn.textContent = '裝備';
                    equipBtn.className = 'equip-btn';
                    equipBtn.onclick = () => this.showEquipConfirmation(itemKey);
                    actionsDiv.appendChild(equipBtn);
                }
                if (itemData.type === 'potion' || itemData.type === 'scroll') {
                    const useBtn = document.createElement('button');
                    useBtn.textContent = '使用';
                    useBtn.className = 'use-btn';
                    useBtn.onclick = () => this.useItem(itemKey);
                    actionsDiv.appendChild(useBtn);
                }
                li.appendChild(actionsDiv);
                listUl.appendChild(li);
            }
        },

        closeSubmenu() { this.setPhase(this.state.lastMajorPhase); },

        showEquipConfirmation(itemKeyToEquip) {
            const itemData = this.data.items[itemKeyToEquip];
            const slot = itemData.slot;
            const currentItemKey = this.state.player.equipped[slot];
            const currentItemData = currentItemKey ? this.data.items[currentItemKey] : null;

            this.DOM.equipModalTitle.textContent = `裝備 ${itemData.name}`;
            const attackDiff = (itemData.attack || 0) - (currentItemData?.attack || 0);
            const defenseDiff = (itemData.defense || 0) - (currentItemData?.defense || 0);
            
            let comparisonHTML = `
                <div>
                    <h3>${currentItemKey ? this.getFormattedItemName(currentItemKey) : '無'} (現有)</h3>
                    <p>攻擊: ${currentItemData?.attack || 0}</p>
                    <p>防禦: ${currentItemData?.defense || 0}</p>
                </div>
                <div>
                    <h3>${this.getFormattedItemName(itemKeyToEquip)} (新裝備)</h3>
                    <p>攻擊: ${itemData.attack || 0} <span class="${attackDiff > 0 ? 'stat-change-gain' : attackDiff < 0 ? 'stat-change-loss' : ''}">(${attackDiff > 0 ? '+' : ''}${attackDiff})</span></p>
                    <p>防禦: ${itemData.defense || 0} <span class="${defenseDiff > 0 ? 'stat-change-gain' : defenseDiff < 0 ? 'stat-change-loss' : ''}">(${defenseDiff > 0 ? '+' : ''}${defenseDiff})</span></p>
                </div>`;
            
            this.DOM.equipComparison.innerHTML = comparisonHTML;
            this.DOM.confirmEquipButton.onclick = () => this.equipItem(itemKeyToEquip);
            this.DOM.equipConfirmModal.classList.remove('hidden');
        },

        equipItem(itemKey) {
            const itemData = this.data.items[itemKey];
            const slot = itemData.slot;
            const currentItemKey = this.state.player.equipped[slot];
            if (currentItemKey) { this.state.player.inventory.push(currentItemKey); }
            this.state.player.equipped[slot] = itemKey;
            const index = this.state.player.inventory.indexOf(itemKey);
            if (index > -1) this.state.player.inventory.splice(index, 1);
            this.appendOutput(`裝備了 ${this.getFormattedItemName(itemKey)}。`, true);
            this.DOM.equipConfirmModal.classList.add('hidden');
            this.updateUI();
            if (this.state.gamePhase === 'inventory') { this.renderInventory(); }
        },

        unequipItem(slotKey) {
            const itemKey = this.state.player.equipped[slotKey];
            if (itemKey) {
                this.state.player.inventory.push(itemKey);
                this.state.player.equipped[slotKey] = null;
                this.appendOutput(`卸下了 ${this.getFormattedItemName(itemKey)}。`, true);
                this.updateUI();
            }
        },

        useItem(itemKey) {
            const itemData = this.data.items[itemKey];
            if (!itemData || !itemData.effect) return;
            let used = false;
            if (itemData.effect.type === 'heal') {
                if (this.state.player.hp < this.state.player.maxHp) {
                    window.AudioManager?.playPotion?.();
                    this.state.player.hp = Math.min(this.state.player.maxHp, this.state.player.hp + itemData.effect.amount);
                    this.appendOutput(`使用了 ${itemData.name}，體力恢復了 ${itemData.effect.amount} 點。`);
                    used = true;
                } else { this.appendOutput('生命值已全滿。'); }
            } else if (itemData.effect.type === 'teleportHome') {
                window.AudioManager?.playLevelUp?.();
                this.appendOutput(`使用了 ${itemData.name}，傳送卷軸化為藍光將你帶回村莊。`);
                this.returnToVillage();
                used = true;
            }
            if (used) {
                const index = this.state.player.inventory.indexOf(itemKey);
                if (index > -1) this.state.player.inventory.splice(index, 1);
                this.updateUI();
                if(this.state.gamePhase === 'inventory') this.renderInventory();
            }
        },

        showShop() {
            this.DOM.shopModal.classList.remove('hidden');
            this.renderButtons([]);
            this.renderShop(this.state.currentShopTab);
        },

        closeShop() {
            this.DOM.shopModal.classList.add('hidden');
            this.setPhase(this.state.lastMajorPhase);
        },

        renderShop(tab) {
            this.state.currentShopTab = tab;
            this.DOM.buyTab.classList.toggle('active', tab === 'buy');
            this.DOM.sellTab.classList.toggle('active', tab === 'sell');
            if (tab === 'buy') { this.renderShopBuyList(); } 
            else { this.renderShopSellList(); }
        },

        renderShopBuyList() {
            const listEl = this.DOM.shopItemList;
            listEl.innerHTML = '';
            this.data.shopInventory.forEach(itemKey => {
                const itemData = this.data.items[itemKey];
                if (!itemData) return;
                const buyPrice = itemData.sell * this.CONSTANTS.SHOP_BUY_PRICE_MULTIPLIER;
                const canAfford = this.state.player.gold >= buyPrice;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                itemDiv.innerHTML = `
                    <div class="shop-item-info">
                        <div class="shop-item-name">${this.getFormattedItemName(itemKey)}</div>
                        <div class="shop-item-price">價格: ${buyPrice} 金幣</div>
                    </div>
                    <button class="shop-action-btn buy-btn" onclick="Game.buyItem('${itemKey}')" ${canAfford ? '' : 'disabled'}>購買</button>`;
                listEl.appendChild(itemDiv);
            });
        },

        renderShopSellList() {
            const listEl = this.DOM.shopItemList;
            listEl.innerHTML = '';
            const itemCounts = this.state.player.inventory.reduce((acc, key) => {
                acc[key] = (acc[key] || 0) + 1;
                return acc;
            }, {});
            
            if (Object.keys(itemCounts).length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-400 p-4">背包沒有任何物品可販賣。</div>';
                return;
            }

            const sellableItems = Object.keys(itemCounts).filter(key => this.data.items[key] && this.data.items[key].sell);
            const sortedItemKeys = this.sortItems(sellableItems);

            for (const itemKey of sortedItemKeys) {
                const itemData = this.data.items[itemKey];
                if (!itemData || !itemData.sell) continue;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                itemDiv.innerHTML = `
                    <div class="shop-item-info">
                        <div class="shop-item-name">${this.getFormattedItemName(itemKey)} (x${itemCounts[itemKey]})</div>
                        <div class="shop-item-price">售價: ${itemData.sell} 金幣</div>
                    </div>
                    <button class="shop-action-btn sell-btn" onclick="Game.sellItem('${itemKey}')">販賣</button>`;
                listEl.appendChild(itemDiv);
            }
        },

        buyItem(itemKey) {
            const itemData = this.data.items[itemKey];
            const buyPrice = itemData.sell * this.CONSTANTS.SHOP_BUY_PRICE_MULTIPLIER;
            if (this.state.player.gold >= buyPrice) {
                this.state.player.gold -= buyPrice;
                this.state.player.inventory.push(itemKey);
                this.appendOutput(`購入了 ${this.getFormattedItemName(itemKey)}。`, true);
                this.updateUI();
                this.renderShop('buy');
            } else { this.appendOutput('金幣不足！'); }
        },

        sellItem(itemKey) {
            const itemData = this.data.items[itemKey];
            const index = this.state.player.inventory.indexOf(itemKey);
            if (index > -1) {
                this.state.player.inventory.splice(index, 1);
                this.state.player.gold += itemData.sell;
                this.appendOutput(`賣出了 ${this.getFormattedItemName(itemKey)}，獲得 ${itemData.sell} 金幣。`, true);
                this.updateUI();
                this.renderShop('sell');
            }
        },

        getFormattedMonsterName(monster) {
            if (!monster) return '';
            const rarity = monster.rarity || 'common';
            const colorClass = {
                common: 'text-gray-300',
                uncommon: 'text-green-400',
                rare: 'text-blue-400',
                legendary: 'text-red-400'
            }[rarity] || 'text-gray-300';
            return `<span class="${colorClass}">${monster.name}</span>`;
        },

        getFormattedChestName(chestType, chestName) {
            const rarityColorMap = {
                wooden: 'text-gray-300',
                sturdy: 'text-green-400',
                ornate: 'text-blue-400',
                legendary: 'text-red-400'
            };
            const colorClass = rarityColorMap[chestType] || 'text-gray-300';
            return `<span class="${colorClass}">${chestName}</span>`;
        },

        getFormattedItemName(itemKey) {
            const itemData = this.data.items[itemKey];
            if (!itemData) return itemKey;
            const rarity = itemData.rarity || 'common';
            const colorClass = {
                common: 'text-gray-300',
                uncommon: 'text-green-400',
                rare: 'text-blue-400',
                legendary: 'text-red-400'
            }[rarity] || 'text-gray-300';
            return `<span class="${colorClass}">${itemData.name}</span>`;
        },

        calculatePlayerStats() {
            const p = this.state.player;
            let totalAttack = p.baseAttack;
            let totalDefense = p.baseDefense;
            for (const slot in p.equipped) {
                const itemKey = p.equipped[slot];
                if (itemKey && this.data.items[itemKey]) {
                    const itemData = this.data.items[itemKey];
                    totalAttack += itemData.attack || 0;
                    totalDefense += itemData.defense || 0;
                }
            }
            return { attack: totalAttack, defense: totalDefense };
        },

        getXpRequiredForLevel(level) {
            if (level < 45) {
                return Math.floor(5.5 * Math.pow(level, 2.9));
            } else {
                const baseFormulaXp = 5.5 * Math.pow(level, 2.9);
                const multiplier = 1.9 * Math.pow(2, level - 45);
                return Math.floor(baseFormulaXp * multiplier);
            }
        },
        
        appendOutput(message, isHTML = false) {
            const output = this.DOM.gameOutput;
            const lineBreak = output.innerHTML.length > 0 ? '<br>' : '';
            if (isHTML) {
                output.innerHTML += lineBreak + message;
            } else {
                output.innerHTML += lineBreak + message.replace(/\n/g, '<br>');
            }
            output.scrollTop = output.scrollHeight;
        },

        setOutput(message, isHTML = false) {
            const output = this.DOM.gameOutput;
            if (isHTML) {
                output.innerHTML = message;
            } else {
                output.textContent = message;
            }
            output.scrollTop = output.scrollHeight;
        },
    };

    window.onload = () => {
        Game.init();
    };
    </script>
</body>
</html>
