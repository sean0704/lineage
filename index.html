<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f16" />
    <meta name="description" content="向經典《天堂》致敬的第一人稱 3D 地監冒險：探索古魯丁地監七層迷宮，挑戰死亡騎士。" />
    <title>天堂 3D：地監冒險</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4l6 28-6 28-6-28z' fill='%23d4a83a'/%3E%3Crect x='18' y='40' width='28' height='5' rx='2' fill='%23b8c0cc'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app">
      <main class="stage" id="stage">
        <div id="viewport" class="viewport" aria-hidden="true"></div>
        <div id="screen-fx" class="screen-fx" aria-hidden="true"></div>
        <div id="float-layer" class="float-layer" aria-hidden="true"></div>

        <header class="hud-top">
          <div id="location" class="badge"></div>
          <div id="monster-card" class="monster-card" hidden>
            <div class="monster-card__head">
              <span id="monster-name" class="monster-card__name"></span>
              <span id="monster-level" class="monster-card__level"></span>
            </div>
            <div class="bar bar--monster"><div id="monster-hp" class="bar__fill"></div><span id="monster-hp-text" class="bar__text"></span></div>
            <div id="monster-status" class="chips"></div>
          </div>
        </header>

        <div id="banner" class="banner" role="status" aria-live="polite"></div>
        <div id="prompt" class="prompt" hidden></div>
        <div id="dpad" class="dpad" hidden></div>
        <nav id="actions" class="actions" aria-label="行動"></nav>
      </main>

      <aside class="panel" aria-label="角色資訊">
        <section class="card char">
          <div class="char__head">
            <div>
              <div id="char-name" class="char__name"></div>
              <div id="char-sub" class="char__sub"></div>
            </div>
            <div id="char-gold" class="gold"></div>
          </div>
          <div class="bar bar--hp" title="體力"><div id="hp-fill" class="bar__fill"></div><span id="hp-text" class="bar__text"></span></div>
          <div class="bar bar--mp" title="魔力"><div id="mp-fill" class="bar__fill"></div><span id="mp-text" class="bar__text"></span></div>
          <div class="bar bar--xp" title="經驗值"><div id="xp-fill" class="bar__fill"></div><span id="xp-text" class="bar__text"></span></div>
          <div class="stats">
            <div class="stat"><span class="stat__label">攻擊</span><span id="stat-atk" class="stat__value"></span></div>
            <div class="stat"><span class="stat__label">防禦</span><span id="stat-def" class="stat__value"></span></div>
            <div class="stat"><span class="stat__label">最深</span><span id="stat-deep" class="stat__value"></span></div>
          </div>
          <div id="buffs" class="chips"></div>
        </section>

        <section class="card">
          <h2 class="card__title">快捷道具 <span class="hint">數字鍵 1–8</span></h2>
          <div id="quickbar" class="quickbar"></div>
        </section>

        <section class="card minimap-card">
          <h2 class="card__title">地圖 <span class="hint">M 放大</span></h2>
          <canvas id="minimap" class="minimap" width="240" height="240"></canvas>
        </section>

        <section class="card log-card">
          <h2 class="card__title">冒險紀錄</h2>
          <ol id="log" class="log" aria-live="polite"></ol>
        </section>

        <footer class="panel__footer">
          <button id="btn-bag" class="btn btn--ghost" type="button">🎒 背包 <kbd>I</kbd></button>
          <button id="btn-menu" class="btn btn--ghost" type="button">⚙️ 選單 <kbd>Esc</kbd></button>
        </footer>
      </aside>
    </div>

    <div id="modal-root"></div>

    <div id="title" class="title-screen">
      <div class="title-screen__inner">
        <p class="title-screen__kicker">LINEAGE · DUNGEON 3D</p>
        <h1 class="title-screen__logo">天堂<span>地監冒險</span></h1>
        <p class="title-screen__tag">深入古魯丁地監七層迷宮，討伐盤踞最深處的死亡騎士。</p>
        <div id="title-actions" class="title-screen__actions"></div>
        <p id="title-note" class="title-screen__note"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
